name: Release
# Push a tag such as v1.0.1 and this builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of the app find the new release by themselves and offer the update.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the placeholders are filled in
        shell: bash
        run: |
          if grep -rq "YOUR-GITHUB-NAME" app-info.json package.json; then echo "Replace YOUR-GITHUB-NAME in app-info.json and package.json first."; exit 1; fi
      - name: Check the tag matches package.json
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json version $V"; exit 1; fi
      - run: npm test
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
