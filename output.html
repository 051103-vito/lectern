<!doctype html>
<html><head><meta charset="utf-8"><title>Output</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="stage.css">
<style>html,body{margin:0;height:100%;background:#000;cursor:none}#stage{position:fixed;inset:0}</style>
</head><body>
<div id="stage" class="stage"><div class="canvas mode-black"></div></div>
<script src="bible.js"></script><script src="render.js"></script>
<script>
  const stage = document.getElementById('stage');
  const fit = () => StageRender.fit(stage);
  addEventListener('resize', fit); fit();
  presenter.onState((s) => StageRender.draw(stage, s));
</script>
</body></html>
